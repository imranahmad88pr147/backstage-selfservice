apiVersion: scaffolder.backstage.io/v1beta3
kind: Template

metadata:
  name: infrastructure-provisioning
  title: Provision Infrastructure
  description: Provision standardized AWS infrastructure through the platform. Security and infrastructure standards are applied automatically.
  tags:
    - infrastructure
    - aws
    - ec2
    - s3

spec:
  type: infrastructure

  parameters:

    - title: Infrastructure
      required:
        - infrastructure
        - resourceName
        - environment
        - purpose

      properties:

        infrastructure:
          title: Infrastructure
          type: array
          description: Select the infrastructure you need
          minItems: 1
          items:
            type: string
            enum:
              - ec2
              - s3
          uniqueItems: true
          ui:widget: checkboxes
          enumNames:
            - EC2 Instance
            - S3 Bucket

        resourceName:
          title: Resource Name
          type: string
          description: A short name identifying this infrastructure
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          ui:autofocus: true

        environment:
          title: Environment
          type: string
          description: Select the infrastructure environment
          enum:
            - dev
            - staging
            - prod
          enumNames:
            - Development
            - Staging
            - Production
          default: dev

        purpose:
          title: Purpose
          type: string
          description: Briefly describe why this infrastructure is needed
          minLength: 10
          ui:widget: textarea

  steps:
  

    - id: fetch-template
      name: Generate Infrastructure
      action: fetch:template
      input:
        url: ./content
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          infrastructure: ${{ parameters.infrastructure }}
          resourceName: ${{ parameters.resourceName }}
          environment: ${{ parameters.environment }}
          purpose: ${{ parameters.purpose }}
          

    - id: publish
      name: Create GitHub Repository
      action: publish:github
      input:
        description: Infrastructure - ${{ parameters.resourceName }} - ${{ parameters.environment }}
        repoUrl: github.com?owner=<GITHUB_ORG>&repo=infra-${{ parameters.resourceName }}-${{ parameters.environment }}
        defaultBranch: main

  output:

    links:
      - title: GitHub Repository
        url: ${{ steps.publish.output.remoteUrl }}