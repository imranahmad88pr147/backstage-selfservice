enableExperimentalRedirectFlow: true

app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Disable the catalog page extension completely
    - page:catalog: false

    # Mount the Home page at the root route `/` and set default layout config
    - page:home:
        config:
          path: /
          defaultConfig:
            - component: GettingStarted
              column: 0
              row: 1
              width: 12
              height: 14

    # Hide the Actions, Template Editor and Templating Extensions tabs on the /create page.
    - 'sub-page:scaffolder/actions': false
    - 'sub-page:scaffolder/editor': false
    - 'sub-page:scaffolder/templating-extensions': false

    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: https://backstage.io/docs
              label: Docs
              icon: docs
            - url: https://github.com/backstage/backstage
              label: GitHub
              icon: github
            - url: https://github.com/backstage/backstage/blob/master/CONTRIBUTING.md
              label: Contributing
              icon: docs
            - url: https://backstage.io/plugins
              label: Plugins Directory
              icon: kind:component
            - url: https://github.com/backstage/backstage/issues/new/choose
              label: Submit New Issue
              icon: github

    - home-page-widget:home/world-clock:
        config:
          clockConfigs:
            - label: NYC
              timeZone: America/New_York
            - label: UTC
              timeZone: UTC
            - label: STO
              timeZone: Europe/Stockholm
            - label: TYO
              timeZone: Asia/Tokyo

organization:
  name: My Company

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007

  csp:
    connect-src: ["'self'", 'http:', 'https:']

  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  database:
    client: better-sqlite3
    connection: ':memory:'

  actions:
    pluginSources:
      - auth
      # - catalog
      - scaffolder

integrations:
  github:
    - host: github.com
      apps:
        - $include: ./github-app-credentials.yaml

proxy: {}

techdocs:
  builder: 'local'
  generator:
    runIn: 'docker'
  publisher:
    type: 'local'

auth:
  environment: development

  session:
    secret: ${AUTH_SESSION_SECRET}

  providers:
    oidc:
      development:
        metadataUrl: https://login.microsoftonline.com/528e1661-6cc7-421d-a76b-03ddae5a611c/v2.0/.well-known/openid-configuration
        clientId: ${AUTH_OIDC_CLIENT_ID}
        clientSecret: ${AUTH_OIDC_CLIENT_SECRET}
        prompt: login

  clientIdMetadataDocuments:
    enabled: false

scaffolder: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration

  rules:
    - allow: [Component, System, API, Resource, Location, Template]

  locations:
    # Healthcare service template used by the self-service platform
    - type: file
      target: ../../templates/healthcare-service/template.yaml
      rules:
        - allow: [Template]

    # Organizational users and groups used by the authentication resolver
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    # - type: file
    #   target: ../../examples/entities.yaml

    # - type: file
    #   target: ../../examples/template/template.yaml
    #   rules:
    #     - allow: [Template]

permission:
  enabled: true

mcpActions:
  name: 'My Company Backstage'
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal'